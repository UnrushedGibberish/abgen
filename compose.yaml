services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: abgen
      POSTGRES_USER: abgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only}
    ports:
      - "127.0.0.1:${ABGEN_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abgen -d abgen"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=abgen;Username=abgen;Password=${POSTGRES_PASSWORD:-development-only}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_0:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_1:-http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:${ABGEN_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "dotnet", "AbGen.Api.dll", "--healthcheck", "/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
